name: Fortnite 5.41 indexed extra original native Ghidra C

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-extra-native-c-catalog.yml"
      - "crates/fortnite_541/tools/index_original_extra_native_c.py"
  pull_request:
    paths:
      - ".github/workflows/fortnite541-extra-native-c-catalog.yml"
      - "crates/fortnite_541/tools/index_original_extra_native_c.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite541-extra-native-c-catalog
  cancel-in-progress: false

jobs:
  audit-extra-source-native-function-bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test exact native C signatures and reject invented C
        run: |
          python3 -m py_compile crates/fortnite_541/tools/index_original_extra_native_c.py
          python3 crates/fortnite_541/tools/index_original_extra_native_c.py --self-test
      - name: Inspect source-verified original native CALL C from the existing decompilation
        shell: bash
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/index_original_extra_native_c.py "$RUNNER_TEMP/native_c_index.py"
          git fetch origin re/fortnite541-ghidra-full
          git checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/native_c_index.py" \
            --root decompilation/fortnite541 \
            --out "$RUNNER_TEMP/native-c-catalog"
          python3 - <<'PY'
          import gzip,json,os,pathlib
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-c-catalog'
          summary=json.loads((dest/'original_extra_native_c_catalog_status.json').read_text())
          with gzip.open(dest/'original_extra_native_c_catalog.jsonl.gz','rt') as f:
              rows=[json.loads(line) for line in f if line.strip()]
          assert len(rows)==61==summary['native_original_call_target_entries']
          assert summary['genuine_native_ghidra_c_bodies'] in (60,61)
          assert all(r['original_rva'].startswith('0x') for r in rows)
          assert all(r['compiled_cpp_linkage_verified'] is False for r in rows)
          print("AUTHENTICATED_EXTRA_NATIVE_GHIDRA_C_SOURCE_CATALOG",summary)
          PY
      - name: Commit original native C evidence index into persistent decompilation branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite 5.41 original extra Ghidra C catalog"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          folder=decompilation/fortnite541/index/original_extra_native_c
          mkdir -p "$folder"
          cp "$RUNNER_TEMP"/native-c-catalog/* "$folder/"
          git add "$folder"
          if ! git diff --cached --quiet; then
            git commit -m "Fortnite: searchable audited authentic original extra native Ghidra C bodies"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then exit 0; fi
              git fetch origin re/fortnite541-ghidra-full
              git rebase origin/re/fortnite541-ghidra-full
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          fi
      - name: Preserve original native C index summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-source-native-c-catalog-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-c-catalog/original_extra_native_c_catalog_status.json
          retention-days: 90
          if-no-files-found: warn
