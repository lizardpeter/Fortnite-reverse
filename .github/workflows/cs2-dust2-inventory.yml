name: CS2 Dust2 exact archive inventory
on:
  push:
    branches: [assets/cs2-dust2-complete-vpk-20261014]
    paths:
      - '.github/workflows/cs2-dust2-inventory.yml'
      - 'ci/cs2-standalone/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/cs2-standalone
            ci/neutral-scene-contract
      - name: Download original Workshop Dust2 files anonymously
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 ca-certificates curl unzip
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 3 --connect-timeout 20 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          cd "$RUNNER_TEMP/steamcmd"
          timeout 900 ./steamcmd.sh +login anonymous +workshop_download_item 730 3620630831 +quit
          src="$HOME/Steam/steamapps/workshop/content/730/3620630831"
          for idx in 000 001 002 003; do test -s "$src/3620630831_$idx.vpk"; done
          test -s "$src/3620630831_dir.vpk"
          echo "WORKSHOP_DIR=$src" >> "$GITHUB_ENV"
      - name: Download base pak01 index anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/depot-tool"
          curl -fL --retry 3 --connect-timeout 20 https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip -o "$RUNNER_TEMP/dd.zip"
          unzip -q "$RUNNER_TEMP/dd.zip" -d "$RUNNER_TEMP/depot-tool"
          chmod +x "$RUNNER_TEMP/depot-tool/DepotDownloader"
          printf '%s\n' 'game/csgo/pak01_dir.vpk' > "$RUNNER_TEMP/base-files.txt"
          timeout 600 "$RUNNER_TEMP/depot-tool/DepotDownloader" -app 730 -depot 2347770 -filelist "$RUNNER_TEMP/base-files.txt" -dir "$RUNNER_TEMP/base"
          test -s "$RUNNER_TEMP/base/game/csgo/pak01_dir.vpk"
          echo "BASE_DIR=$RUNNER_TEMP/base/game/csgo" >> "$GITHUB_ENV"
      - name: Compile exact source dep analyzer
        shell: bash
        run: |
          cargo build --release --manifest-path ci/cs2-standalone/Cargo.toml --bin cs2_inventory
      - name: Enumerate all source-authored VMAT archive indices for both maps
        shell: bash
        run: |
          set -euo pipefail
          ci/cs2-standalone/target/release/cs2_inventory materials \
            "$WORKSHOP_DIR/3620630831_dir.vpk" "$BASE_DIR/pak01_dir.vpk" | tee "$RUNNER_TEMP/material-indices.log"
          grep 'ASSET_PLAN_END' "$RUNNER_TEMP/material-indices.log"
      - name: Download all exact original material definition VPK parts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])
          lines=(root/'material-indices.log').read_text().splitlines()
          parts=[int(row.split('|')[2]) for row in lines if row.startswith('ASSET_PLAN_PART|materials|')]
          assert parts, 'Empty Source 2 material asset plan'
          (root/'materials-filelist.txt').write_text(
            ''.join(f'game/csgo/pak01_{idx:03d}.vpk\n' for idx in parts))
          print('DOWNLOAD_ORIGINAL_MATERIAL_VPKS',','.join(f'{i:03d}' for i in parts))
          PY
          timeout 1100 "$RUNNER_TEMP/depot-tool/DepotDownloader" -app 730 -depot 2347770 \
            -filelist "$RUNNER_TEMP/materials-filelist.txt" -dir "$RUNNER_TEMP/base" -max-downloads 5
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          names=[x.rsplit('/',1)[-1] for x in (root/'materials-filelist.txt').read_text().splitlines()]
          for n in names:
              f=root/'base/game/csgo'/n
              assert f.exists() and f.stat().st_size>0, f'Missing original VMAT archive {n}'
          print('SOURCE_VMATS_DOWNLOADED',len(names),'base_dir_size_bytes',sum(x.stat().st_size for x in (root/'base/game/csgo').glob('*.vpk')))
          PY
      - name: Resolve exact VTEX and lightmap dependencies from every original VMAT
        shell: bash
        run: |
          set -euo pipefail
          ci/cs2-standalone/target/release/cs2_inventory textures \
            "$WORKSHOP_DIR/3620630831_dir.vpk" "$BASE_DIR/pak01_dir.vpk" | tee "$RUNNER_TEMP/texture-indices.log"
          grep 'ASSET_PLAN_END' "$RUNNER_TEMP/texture-indices.log"
      - name: Build exact source-byte extraction manifest
        shell: bash
        run: |
          set -euo pipefail
          grep '^ASSET_PLAN_RESOURCE|' "$RUNNER_TEMP/material-indices.log" > "$RUNNER_TEMP/asset-records.txt"
          grep '^ASSET_PLAN_RESOURCE|' "$RUNNER_TEMP/texture-indices.log" >> "$RUNNER_TEMP/asset-records.txt"
          sort -u "$RUNNER_TEMP/asset-records.txt" -o "$RUNNER_TEMP/asset-records.txt"
          echo "ORIGINAL_COMPILED_RESOURCES=$(wc -l < "$RUNNER_TEMP/asset-records.txt")"
          head -n 3 "$RUNNER_TEMP/asset-records.txt"
      - name: Publish exact source resource manifest
        uses: actions/upload-artifact@v4
        with:
          name: cs2-dust2-compact-resource-manifest
          path: ${{ runner.temp }}/asset-records.txt
          retention-days: 14
      - name: Upload original texture dependency index
        uses: actions/upload-artifact@v4
        with:
          name: cs2-dust2-exact-texture-vpk-index
          path: ${{ runner.temp }}/texture-indices.log
          retention-days: 30
      - name: Upload source VMAT index
        uses: actions/upload-artifact@v4
        with:
          name: cs2-dust2-exact-material-vpk-index
          path: ${{ runner.temp }}/material-indices.log
          retention-days: 30
