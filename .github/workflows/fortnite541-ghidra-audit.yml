name: Fortnite 5.41 decompilation integrity audit

on:
  push:
    paths:
      - "crates/fortnite_541/tools/audit_ghidra_dump.py"
      - ".github/workflows/fortnite541-ghidra-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-permanent-original-pseudocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate auditor against synthetic successful, missing, and failed original functions
        run: python3 crates/fortnite_541/tools/audit_ghidra_dump.py --self-test
      - name: Audit every actual original retail function record committed so far
        shell: bash
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/audit_ghidra_dump.py "$RUNNER_TEMP/audit_ghidra_dump.py"
          git fetch origin re/fortnite541-ghidra-full
          git checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/audit_ghidra_dump.py" --root decompilation/fortnite541
