name: Fortnite 5.41 original bounded Ghidra recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/fortnite541-bounded-recover.yml", "crates/fortnite_541/ghidra/Fortnite541RecoverBoundedPdata.java", "crates/fortnite_541/tools/audit_ghidra_recovery.py"]
  pull_request:
    paths: [".github/workflows/fortnite541-bounded-recover.yml", "crates/fortnite_541/ghidra/Fortnite541RecoverBoundedPdata.java", "crates/fortnite_541/tools/audit_ghidra_recovery.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fortnite541-original-unwind-bounded-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Test source-verified audit and plan all 56 original failures
        id: p
        run: |
          set -euo pipefail
          python3 crates/fortnite_541/tools/prepare_ghidra_recovery.py --self-test
          python3 crates/fortnite_541/tools/audit_ghidra_recovery.py --self-test
          git fetch origin re/fortnite541-ghidra-full
          git show origin/re/fortnite541-ghidra-full:decompilation/fortnite541/recovery_remaining.jsonl.gz > "$RUNNER_TEMP/remaining.gz"
          python3 - <<'PY'
          import gzip,json,os
          with gzip.open(os.environ["RUNNER_TEMP"]+"/remaining.gz","rt") as f:
              rows=[json.loads(s) for s in f if s.strip()]
          assert len(rows)==56 and len({r["index"] for r in rows})==56
          jobs=[{"start":i,"count":14,"label":f"{i:03d}"} for i in range(0,56,14)]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps({"include":jobs},separators=(",",":"))+"\n")
          print("FORTNITE541_BOUNDED_ORIGINAL_RECOVERY_QUEUE",jobs)
          PY
  original-pdata-4-shard-ghidra:
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ORIGINAL_URL: https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
      ORIGINAL_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Authenticate original retail PE and official Ghidra; extract bounded queue
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/scripts" "$RUNNER_TEMP/project" "$RUNNER_TEMP/recovered"
          cp crates/fortnite_541/ghidra/Fortnite541RecoverBoundedPdata.java "$RUNNER_TEMP/scripts/"
          git fetch origin re/fortnite541-ghidra-full
          git show origin/re/fortnite541-ghidra-full:decompilation/fortnite541/recovery_remaining.jsonl.gz > "$RUNNER_TEMP/source/queue.gz"
          python3 crates/fortnite_541/tools/prepare_ghidra_recovery.py \
            --unresolved "$RUNNER_TEMP/source/queue.gz" \
            --start ${{ matrix.start }} --count ${{ matrix.count }} --out "$RUNNER_TEMP/source/targets.tsv"
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 "$ORIGINAL_URL" -o "$RUNNER_TEMP/source/original.exe"
          echo "$ORIGINAL_SHA256  $RUNNER_TEMP/source/original.exe" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 25 --max-time 350 "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          exe="$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          echo "GHIDRA_BIN=$exe" >> "$GITHUB_ENV"
      - name: Create genuine original unwind-bounded Ghidra C or explicit failure
        run: |
          set -euo pipefail
          "$GHIDRA_BIN" "$RUNNER_TEMP/project" Fortnite541Bounded \
            -import "$RUNNER_TEMP/source/original.exe" -noanalysis \
            -scriptPath "$RUNNER_TEMP/scripts" \
            -postScript Fortnite541RecoverBoundedPdata.java "$RUNNER_TEMP/recovered" "$RUNNER_TEMP/source/targets.tsv" 45 \
            -max-cpu 3 2>&1 | tee "$RUNNER_TEMP/ghidra.log"
          grep -q FORTNITE541_ORIGINAL_BOUNDED_PDATA_RECOVERY_COMPLETE "$RUNNER_TEMP/ghidra.log"
      - name: Independently verify source ordinal identity, authentic C and results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,glob,json,os,pathlib
          t=pathlib.Path(os.environ["RUNNER_TEMP"])
          expected=[(int(i),s,e) for i,s,e in
                    (line.split("\t") for line in (t/"source/targets.tsv").read_text().splitlines())]
          files=glob.glob(str(t/"recovered/records/bounded_*.jsonl.gz"))
          assert len(files)==1
          with gzip.open(files[0],"rt") as f: rows=[json.loads(s) for s in f if s.strip()]
          assert len(rows)==len(expected)
          for row,(idx,start,end) in zip(rows,expected):
              assert (row["index"],row["rva"],row["end_rva"])==(idx,start,end)
              assert row["recovery_mode"]=="bounded_v1"
              assert row["status"] in ("decompiled","decompiler_failed","missing_function")
              if row["status"]=="decompiled":
                  assert row["exact_original_pdata_body_applied"] is True
                  assert row["retail_entry_instruction_decoded"] is True
                  assert row["original_pdata_executable"] is True
                  assert isinstance(row["c"],str) and row["c"].strip()
              else: assert not row.get("c")
          summary=json.loads((t/"recovered/recovery_summary.json").read_text())
          assert summary["retry_count"]==len(rows)
          assert summary["recovered"]==sum(r["status"]=="decompiled" for r in rows)
          assert summary["missing"]==sum(r["status"]=="missing_function" for r in rows)
          assert summary["decompiler_failed"]==sum(r["status"]=="decompiler_failed" for r in rows)
          (t/"recovered/reports").mkdir()
          (t/"recovered/recovery_summary.json").rename(
              t/"recovered/reports"/(pathlib.Path(files[0]).name[:-len(".jsonl.gz")]+".json"))
          print("SOURCE_RETAIL_BOUNDED_GHIDRA_C_VERIFIED",summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fortnite541-bounded-original-C-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/recovered/records/
            ${{ runner.temp }}/recovered/reports/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortnite541-bounded-logs-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/ghidra.log
            ${{ runner.temp }}/source/targets.tsv
          if-no-files-found: warn
  audit-and-save-original-source-c:
    if: github.ref == 'refs/heads/main'
    needs: [plan, original-pdata-4-shard-ghidra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: fortnite541-bounded-original-C-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Independently audit full 56-entry original queue and commit only actual Ghidra C
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/audit_ghidra_recovery.py "$RUNNER_TEMP/audit_original.py"
          git config user.name "Fortnite 5.41 exact original Ghidra recovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          root=decompilation/fortnite541
          mkdir -p "$root/recovery/bounded_v1"
          cp -r "$RUNNER_TEMP/shards/." "$root/recovery/bounded_v1/"
          python3 - <<'PY'
          import gzip,json,pathlib
          r=pathlib.Path("decompilation/fortnite541")
          with gzip.open(r/"recovery_remaining.jsonl.gz","rt") as f:
              original={x["index"]:x for line in f if line.strip() for x in [json.loads(line)]}
          checked={}
          for p in (r/"recovery/bounded_v1/records").glob("bounded_*.jsonl.gz"):
              assert (r/"recovery/bounded_v1/reports"/(p.name[:-len(".jsonl.gz")]+".json")).exists()
              with gzip.open(p,"rt") as f:
                  for line in f:
                      if not line.strip(): continue
                      x=json.loads(line)
                      assert x["index"] not in checked
                      assert (x["rva"],x["end_rva"])==(original[x["index"]]["rva"],original[x["index"]]["end_rva"])
                      checked[x["index"]]=x
          assert len(checked)==len(original)==56
          print("ALL_56_SOURCE_BOUNDED_GHIDRA_ATTEMPTS",sum(x["status"]=="decompiled" for x in checked.values()))
          PY
          python3 "$RUNNER_TEMP/audit_original.py" --root "$root"
          git add "$root/recovery/bounded_v1" "$root/recovery_status.json" "$root/recovery_remaining.jsonl.gz"
          if ! git diff --cached --quiet; then
            git commit -m "Fortnite: recover real Ghidra C from original unwind-bounded failed entries"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then exit 0; fi
              git fetch origin re/fortnite541-ghidra-full
              git rebase origin/re/fortnite541-ghidra-full
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          fi
