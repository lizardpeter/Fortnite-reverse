name: Fortnite 5.41 original CFG to Ghidra C linkage evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-cfg-c-crosslink.yml"
      - "crates/fortnite_541/tools/crosslink_original_cfg_calls.py"
  pull_request:
    paths:
      - ".github/workflows/fortnite541-cfg-c-crosslink.yml"
      - "crates/fortnite_541/tools/crosslink_original_cfg_calls.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite541-cfg-c-crosslink
  cancel-in-progress: false

jobs:
  crosslink-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject fabricated original function identity and test strict target spans
        run: |
          python3 -m py_compile crates/fortnite_541/tools/crosslink_original_cfg_calls.py
          python3 crates/fortnite_541/tools/crosslink_original_cfg_calls.py --self-test

  crosslink-retail-cfg-and-original-ghidra-c:
    needs: crosslink-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact source tool and switch to preserved original-function corpus
        run: |
          cp crates/fortnite_541/tools/crosslink_original_cfg_calls.py "$RUNNER_TEMP/crosslink.py"
          git fetch origin re/fortnite541-ghidra-full
          git checkout --detach FETCH_HEAD
      - name: Join true original CFG-reachable CALLs with audited real Ghidra C source index
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/crosslink.py" --root decompilation/fortnite541 \
            --output "$RUNNER_TEMP/crosslink" | tee "$RUNNER_TEMP/crosslink.log"
          python3 - <<'PY'
          import gzip,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"crosslink"
          summary=json.loads((folder/"original_cfg_c_crosslink_summary.json").read_text())
          count=0
          with gzip.open(folder/"original_e8_cfg_c_crosslinks.jsonl.gz","rt") as f:
              for line in f:
                  record=json.loads(line)
                  assert record["evidence"]=="original_sha256_cfg_reachable_e8_plus_audited_ghidra_c_index"
                  assert record["retail_call_is_cpp_linkage_verified"] is False
                  count+=1
          assert count==3258==summary["source_verified_cfg_e8_calls"]
          assert not summary["native_cpp_linkage_verified"]
          print("FORTNITE541_ORIGINAL_CFG_C_CROSSLINK_VALIDATED",summary)
          PY
      - name: Persist source crosslinks to existing original decompilation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite original native CFG and Ghidra C"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          mkdir -p decompilation/fortnite541/index/original_cfg_c_crosslinks
          cp "$RUNNER_TEMP"/crosslink/* decompilation/fortnite541/index/original_cfg_c_crosslinks/
          git add decompilation/fortnite541/index/original_cfg_c_crosslinks
          if ! git diff --cached --quiet; then
            git commit -m "Fortnite: crosslink original CFG CALLs to exact original Ghidra C source files"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then exit 0; fi
              git fetch origin re/fortnite541-ghidra-full
              git rebase origin/re/fortnite541-ghidra-full
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          fi
      - name: Keep original-source crosslink summary without retail binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-original-cfg-c-crosslinks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crosslink/original_cfg_c_crosslink_summary.json
            ${{ runner.temp }}/crosslink/original_cfg_c_target_neighborhoods.json
            ${{ runner.temp }}/crosslink.log
          retention-days: 90
          if-no-files-found: warn
