name: Validate real CS2 VCS static dynamic GPU decode
on:
  push:
    branches: [probe/cs2-vcs-native-ci-20261015]
    paths: ['.github/workflows/cs2-vcs-native-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-vcs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/cs2-standalone
            ci/neutral-scene-contract
      - name: Compile and unit-test current isolated Rust Source 2 importer
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path ci/cs2-standalone/Cargo.toml --lib
      - name: Retrieve original Workshop VPK archive in four independently verified parts
        uses: actions/download-artifact@v4
        with:
          pattern: cs2-workshop-local-part-*
          run-id: 38677787314
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/workshop-parts
      - name: Reconstruct original Valve Workshop package and verify Source2 entity bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/workshop-parts"
          cat workshop-part-00.bin workshop-part-01.bin workshop-part-02.bin workshop-part-03.bin > "$RUNNER_TEMP/workshop-original.zip"
          cd "$RUNNER_TEMP"
          sha256sum -c "$RUNNER_TEMP/workshop-parts/workshop-original.sha256"
          mkdir -p "$RUNNER_TEMP/original-cs2-workshop"
          unzip -q "$RUNNER_TEMP/workshop-original.zip" -d "$RUNNER_TEMP/original-cs2-workshop"
          export ORIGINAL_CS2_WORKSHOP_DIR="$RUNNER_TEMP/original-cs2-workshop"
          cd "$GITHUB_WORKSPACE"
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin kv3_launch_validation
      - name: Obtain original compiled PC Source 2 shader stages
        uses: actions/download-artifact@v4
        with:
          name: cs2-original-vcs-pc
          run-id: 38677787314
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pc
      - name: Obtain original compiled Vulkan Source 2 shader stages
        uses: actions/download-artifact@v4
        with:
          name: cs2-original-vcs-vulkan
          run-id: 38677787314
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/vulkan
      - name: Obtain the two exact Source 2 shader compression dictionaries
        uses: actions/download-artifact@v4
        with:
          name: cs2-source2-zstd-vcs-dictionaries
          run-id: 38678860607
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dictionaries
      - name: Execute authentic source compiler static and dynamic GPU program recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-vcs"
          cp "$RUNNER_TEMP"/pc/cs2-base-resources/shaders/vfx/*.vcs "$RUNNER_TEMP/source-vcs/"
          cp "$RUNNER_TEMP"/vulkan/cs2-base-resources/shaders/vfx/*.vcs "$RUNNER_TEMP/source-vcs/"
          export CS2_NATIVE_CORPUS="$RUNNER_TEMP/source-vcs"
          export CS2_NATIVE_DICTIONARIES="$RUNNER_TEMP/dictionaries"
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin vcs_native_validation
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin vcs_census_validation
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin vcs_naga_ir_validation
# validation rerun after KV3 compatibility correction

