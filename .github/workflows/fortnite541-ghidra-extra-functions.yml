name: Fortnite 5.41 original PE non-pdata native function inventory

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - ".github/workflows/fortnite541-ghidra-extra-functions.yml"
      - "crates/fortnite_541/ghidra/Fortnite541LeafDiscovery.java"
      - "crates/fortnite_541/ghidra/Fortnite541DirectCalls.java"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-real-executable-functions-outside-unwind-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_URL: https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
      SOURCE_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify authenticated original retail executable and Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/project" "$RUNNER_TEMP/discovery"
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 "$SOURCE_URL" -o "$RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 25 --max-time 350 "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          bin="$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GHIDRA_BIN=$bin" >> "$GITHUB_ENV"
      - name: Enumerate original executable function starts not in .pdata
        shell: bash
        env:
          RUN_FULL_ANALYSIS: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RUN_FULL_ANALYSIS" == "true" ]]; then
            options+=("-analysisTimeoutPerFile" "600")
          else
            options+=("-noanalysis")
          fi
          "$GHIDRA_BIN" "$RUNNER_TEMP/project" Fortnite541NonPdata \
            -import "$RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe" \
            "${options[@]}" \
            -scriptPath "$GITHUB_WORKSPACE/crates/fortnite_541/ghidra" \
            -postScript Fortnite541LeafDiscovery.java "$RUNNER_TEMP/discovery" \
            -postScript Fortnite541DirectCalls.java "$RUNNER_TEMP/discovery" \
            -max-cpu 3 2>&1 | tee "$RUNNER_TEMP/ghidra-discovery.log"
          grep -q FORTNITE541_NONPDATA_COMPLETE "$RUNNER_TEMP/ghidra-discovery.log"
          grep -q FORTNITE541_NONPDATA_DIRECT_CALLS_COMPLETE "$RUNNER_TEMP/ghidra-discovery.log"
      - name: Verify independent leaf-candidate classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"discovery"
          report=json.loads((base/"nonpdata_report.json").read_text())
          assert report["original_pdata_entries"]==291757,report
          with gzip.open(base/"nonpdata_candidates.jsonl.gz","rt") as stream:
              rows=[json.loads(line) for line in stream if line.strip()]
          assert len(rows)==report["additional_ghidra_candidates"],report
          assert len(rows)==report["inside_existing_pdata"]+report["outside_original_pdata"]
          assert len({x["rva"] for x in rows})==len(rows),"Repeated candidate RVA"
          assert all(x["classification"] in ("inside_existing_pdata","outside_original_pdata") for x in rows)
          assert all(x["memory_block"] and isinstance(x["body_bytes"],int) for x in rows)
          print("AUTHENTICATED_NONPDATA_GHIDRA_CANDIDATES_VERIFIED",report)
          direct=json.loads((base/"nonpdata_direct_calls_report.json").read_text())
          assert direct["original_pdata_entries"]==291757,direct
          with gzip.open(base/"nonpdata_direct_calls.jsonl.gz","rt") as f:
              call_targets=[json.loads(line) for line in f if line.strip()]
          assert len(call_targets)==direct["nonpdata_unique_call_targets"],direct
          assert len({r["target_rva"] for r in call_targets})==len(call_targets)
          assert sum(r["direct_calls"] for r in call_targets)==direct["nonpdata_direct_call_edges"]
          assert sum(r["has_entry_instruction"] for r in call_targets)==direct["target_entry_instruction_decoded"]
          assert sum(r["ghidra_function"] for r in call_targets)==direct["target_ghidra_functions"]
          assert sum(r["is_thunk"] for r in call_targets)==direct["target_ghidra_thunks"]
          assert all(r["target_rva"].startswith("0x") and r["first_callsite_rva"].startswith("0x")
                     and r["direct_calls"]>0 and (not r["is_thunk"] or r["ghidra_function"])
                     for r in call_targets)
          assert all(int(r["target_rva"],16)>=0 and int(r["first_callsite_rva"],16)>=0
                     for r in call_targets)
          print("AUTHENTICATED_NONPDATA_DIRECT_CALL_EVIDENCE_VERIFIED",direct)
          PY
      - name: Commit original function-discovery evidence separately from real C pseudocode
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite 5.41 non-pdata discovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          mkdir -p decompilation/fortnite541/discovery
          cp "$RUNNER_TEMP/discovery/nonpdata_candidates.jsonl.gz" decompilation/fortnite541/discovery/
          cp "$RUNNER_TEMP/discovery/nonpdata_report.json" decompilation/fortnite541/discovery/
          cp "$RUNNER_TEMP/discovery/nonpdata_direct_calls.jsonl.gz" decompilation/fortnite541/discovery/
          cp "$RUNNER_TEMP/discovery/nonpdata_direct_calls_report.json" decompilation/fortnite541/discovery/
          git add decompilation/fortnite541/discovery
          git commit -m "Ghidra: original executable leaf candidate inventory outside .pdata"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then break; fi
            git fetch origin re/fortnite541-ghidra-full
            git rebase origin/re/fortnite541-ghidra-full
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            sleep "$attempt"
          done
      - name: Preserve source-backed discovery evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-original-nonpdata-discovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/discovery/
            ${{ runner.temp }}/ghidra-discovery.log
          retention-days: 14
          if-no-files-found: warn
