name: Anonymous Steam Workshop download test
on:
  push:
    branches:
      - probe/steamcmd-anonymous-3620630831
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/cs2-standalone
            ci/neutral-scene-contract
          persist-credentials: false
      - name: Compile and unit-test mirrored CS2 importer
        run: cargo test --manifest-path ci/cs2-standalone/Cargo.toml -- --nocapture
      - name: Install SteamCMD runtime and download SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 ca-certificates curl
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
      - name: Download map anonymously and report result
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/steamcmd"
          echo "Testing anonymous access to app=730 workshop_item=3620630831"
          timeout 1200 ./steamcmd.sh +login anonymous +workshop_download_item 730 3620630831 +quit 2>&1 | tee "$RUNNER_TEMP/steamcmd-attempt.log"
          steam_status=${PIPESTATUS[0]}
          echo "SteamCMD process exit status: $steam_status"
          echo "SteamCMD outcome lines:"
          grep -Ei 'Downloading item|Downloaded item|ERROR!|Access Denied|fail|success' "$RUNNER_TEMP/steamcmd-attempt.log" | tail -n 45 || true
          echo "Looking for actual downloaded item files..."
          map_dir=$(find "$HOME/Steam" "$RUNNER_TEMP/steamcmd" "$HOME/.steam" "$HOME/.local/share/Steam" -type d -path '*/workshop/content/730/3620630831' -print -quit 2>/dev/null)
          if [[ -n "$map_dir" ]] && [[ -n "$(find "$map_dir" -type f -print -quit)" ]]; then
            echo "SUCCESS: anonymous download produced actual files."
            echo "Map directory: $map_dir"
            du -sh "$map_dir"
            find "$map_dir" -type f -printf '%P (%s bytes)\n' | head -n 40
            echo "### Anonymous SteamCMD: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "App 730, Workshop 3620630831: files downloaded. File sizes listed in job logs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAILURE: No map files downloaded anonymously; see SteamCMD output above."
            echo "### Anonymous SteamCMD: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "App 730, Workshop 3620630831: no map files found. Inspect job logs for access denial or other error." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Package VPK files for download
        uses: actions/upload-artifact@v4
        with:
          name: cs2-workshop-3620630831-vpk
          path: ~/Steam/steamapps/workshop/content/730/3620630831/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Inspect actual Source 2 VPK directory
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, collections, pathlib
          path=pathlib.Path.home()/'Steam/steamapps/workshop/content/730/3620630831/3620630831_dir.vpk'
          raw=path.read_bytes()
          print('VPK_DIR_BYTES',len(raw),'HEADER_64',raw[:64].hex(' '))
          if len(raw)<28: raise ValueError('short directory')
          u32=lambda at: struct.unpack_from('<I',raw,at)[0]
          print('VPK_SIGNATURE',hex(u32(0)),'VERSION',u32(4),'TREE_SIZE',u32(8))
          for i in range(12,28,4): print('HEADER_WORD',i,u32(i))
          if u32(0)!=0x55aa1234: raise ValueError('Not VPK')
          version=u32(4)
          cursor=12 if version==1 else 28
          tree_end=cursor+u32(8)
          if tree_end>len(raw): raise ValueError('Tree past EOF')
          count=0
          exts=collections.Counter()
          samples=[]
          def string():
              global cursor
              end=raw.find(b'\0',cursor,tree_end)
              if end<0: raise ValueError('unterminated string at '+str(cursor))
              value=raw[cursor:end].decode('utf-8','replace')
              cursor=end+1
              return value
          while cursor<tree_end:
              ext=string()
              if not ext: break
              while True:
                  directory=string()
                  if not directory: break
                  while True:
                      stem=string()
                      if not stem: break
                      if cursor+18>tree_end: raise ValueError('Entry truncated')
                      crc,preload,archive,offset,length,marker=struct.unpack_from('<IHHIIH',raw,cursor)
                      cursor+=18
                      if marker!=0xffff: raise ValueError(f'Bad entry sentinel {marker:x} at {cursor}')
                      cursor+=preload
                      count+=1
                      exts[ext]+=1
                      filename=stem+'.'+ext
                      full=(directory+'/' if directory!=' ' else '')+filename
                      if len(samples)<60 or ext.lower() in ('vwrld_c','vmap_c','vwnod_c','vmdl_c'):
                          if len(samples)<120: samples.append((full,archive,offset,length,preload))
          print('FILE_COUNT',count,'TREE_END',tree_end,'PARSED_TO',cursor)
          print('EXTENSIONS',exts.most_common(40))
          for entry in samples[:120]: print('ENTRY',repr(entry))
          PY
      - name: Inspect nested map VPKs and Source 2 resource headers
        shell: bash
        run: |
          python3 - <<'PY'
          import struct,collections,pathlib
          root=pathlib.Path.home()/'Steam/steamapps/workshop/content/730/3620630831'
          def parse(raw):
              if len(raw)<28 or raw[:4]!=b'\x34\x12\xaa\x55': raise ValueError('Bad VPK signature')
              ver,ts=struct.unpack_from('<II',raw,4)
              pos=12 if ver==1 else 28
              end=pos+ts
              if end>len(raw): raise ValueError('truncated VPK tree')
              entries={}
              def readstr():
                  nonlocal pos
                  q=raw.find(b'\0',pos,end)
                  if q<0: raise ValueError('bad VPK string')
                  s=raw[pos:q].decode('utf-8','replace');pos=q+1;return s
              while pos<end:
                  ext=readstr()
                  if not ext: break
                  while True:
                      folder=readstr()
                      if not folder: break
                      while True:
                          stem=readstr()
                          if not stem: break
                          crc,preload,arc,off,length,marker=struct.unpack_from('<IHHIIH',raw,pos);pos+=18
                          if marker!=65535: raise ValueError('bad VPK sentinel')
                          pos+=preload
                          name=(folder+'/' if folder!=' ' else '')+stem+'.'+ext
                          entries[name]=(arc,off,length,preload)
              return entries,ver,ts,end
          outer,ver,ts,end=parse((root/'3620630831_dir.vpk').read_bytes())
          for path in ['models/christmastree.vmdl_c','materials/christmaslightsemmissive_psd_c208f500.vtex_c','maps/de_dust2_christmas.vpk','maps/de_dust2_winter.vpk']:
              arc,off,size,preload=outer[path]
              with (root/f'3620630831_{arc:03d}.vpk').open('rb') as f:
                  f.seek(off);head=f.read(min(128,size))
                  f.seek(off);payload=f.read(size) if path.endswith('.vpk') else head
              print('SOURCE',path,'archive',arc,'offset',off,'length',size,'first_96',head[:96].hex(' '))
              if path.endswith('.vpk'):
                  try:
                      entries,v,tree,te=parse(payload)
                      print('NESTED',path,'version',v,'tree',tree,'entry_count',len(entries),'types',collections.Counter(p.rsplit('.',1)[-1] for p in entries).most_common(30))
                      for p,rec in list(entries.items())[:25]: print('NESTED_ENTRY',p,rec)
                  except Exception as err: print('NESTED_PARSE_ERROR',path,repr(err))
              else:
                  if len(head)>=16:
                      print('RESOURCE_WORDS',struct.unpack_from('<IHHII',head))
                      off1=struct.unpack_from('<I',head,8)[0];n=struct.unpack_from('<I',head,12)[0]
                      if n<64 and off1<96:
                          print('RESOURCE_BLOCK_TABLE',head[off1:off1+min(n*12,128)].hex(' '))
          PY
      - name: Validate actual CS2 map resources with native Rust importer
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path ci/cs2-standalone/Cargo.toml --bin cs2_source_audit -- \
            "$HOME/Steam/steamapps/workshop/content/730/3620630831/3620630831_dir.vpk"
      - name: Download CS2 base Dust2 material and sky VPKs anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/depot-tool"
          curl -fL --retry 3 https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip -o "$RUNNER_TEMP/depot-tool.zip"
          unzip -q "$RUNNER_TEMP/depot-tool.zip" -d "$RUNNER_TEMP/depot-tool"
          printf '%s\\n' 'game/csgo/pak01_dir.vpk' 'game/csgo/pak01_262.vpk' 'game/csgo/pak01_386.vpk' > "$RUNNER_TEMP/base-select.txt"
          mkdir -p "$RUNNER_TEMP/cs2-base"
          chmod +x "$RUNNER_TEMP/depot-tool/DepotDownloader"
          timeout 780 "$RUNNER_TEMP/depot-tool/DepotDownloader" -app 730 -depot 2347770 -filelist "$RUNNER_TEMP/base-select.txt" -dir "$RUNNER_TEMP/cs2-base" -max-downloads 4
          base="$RUNNER_TEMP/cs2-base/game/csgo"
          test -s "$base/pak01_dir.vpk"
          test -s "$base/pak01_262.vpk"
          test -s "$base/pak01_386.vpk"
          echo "RUST_TEST_CS2_GAME_VPK_DIR=$base" >> "$GITHUB_ENV"
          echo "Base CS2 files downloaded and available to source import test: $(du -sh "$base")"
      - name: Verify original CS2 texture pixels and base material dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin texture_audit -- \
            "$HOME/Steam/steamapps/workshop/content/730/3620630831/3620630831_dir.vpk" \\
            "$RUST_TEST_CS2_GAME_VPK_DIR/pak01_dir.vpk"
      - name: Verify source geometry reaches NeutralScene without proprietary assets in Git
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path ci/cs2-standalone/Cargo.toml --bin cs2_preview_validation -- \
            "$HOME/Steam/steamapps/workshop/content/730/3620630831/3620630831_dir.vpk"
