name: Fortnite 5.41 recover unresolved Ghidra functions

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - ".github/workflows/fortnite541-ghidra-recover.yml"
      - "crates/fortnite_541/ghidra/Fortnite541Recover.java"
      - "crates/fortnite_541/tools/prepare_ghidra_recovery.py"
      - "crates/fortnite_541/tools/audit_ghidra_recovery.py"
  workflow_dispatch:
    inputs:
      queue_start:
        type: string
        default: "0"
        required: true
        description: "First entry in unresolved-function queue"
      count:
        type: string
        default: "128"
        required: true
        description: "Number of unresolved functions for a targeted retry"
      full_analysis:
        type: boolean
        default: false
        required: true
        description: "Analyze whole PE before retrying these functions"
      timeout_seconds:
        type: string
        default: "30"
        required: true
        description: "Ghidra timeout per retry, 1-120 seconds"

permissions:
  contents: write

concurrency:
  group: fortnite541-original-bounded-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-source-verified-recovery:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      mode: ${{ steps.queue.outputs.mode }}
      queue_path: ${{ steps.queue.outputs.queue_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan targeted probe or all unresolved original function shards
        id: queue
        shell: bash
        env:
          MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'bound_all' || 'bound_probe' }}
          QUEUE_START: ${{ inputs.queue_start || '0' }}
          RETRY_COUNT: ${{ inputs.count || '128' }}
        run: |
          set -euo pipefail
          python3 crates/fortnite_541/tools/prepare_ghidra_recovery.py --self-test
          python3 crates/fortnite_541/tools/audit_ghidra_recovery.py --self-test
          git fetch origin re/fortnite541-ghidra-full
          queue_path=decompilation/fortnite541/recovery_remaining.jsonl.gz
          if [[ "$MODE" == "split_rest" ]]; then
            queue_path=decompilation/fortnite541/recovery/split_v1/source_unresolved.jsonl.gz
          fi
          git show "origin/re/fortnite541-ghidra-full:$queue_path" > "$RUNNER_TEMP/unresolved.jsonl.gz"
          echo "queue_path=$queue_path" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import gzip,json,os
          with gzip.open(os.path.join(os.environ["RUNNER_TEMP"],"unresolved.jsonl.gz"),"rt") as f:
              total=sum(bool(line.strip()) for line in f)
          if os.environ["MODE"]=="bound_probe":
              chunks=[{"start":0,"count":min(16,total),"label":"000000"}]
          elif os.environ["MODE"]=="bound_all":
              chunks=[{"start":i,"count":min(16,total-i),"label":f"{i:06d}"} for i in range(0,total,16)]
          elif os.environ["MODE"]=="full_probe":
              chunks=[{"start":0,"count":min(8,total),"label":"000000"}]
          elif os.environ["MODE"]=="full_all":
              chunks=[{"start":i,"count":min(16,total-i),"label":f"{i:06d}"} for i in range(0,total,16)]
          elif os.environ["MODE"]=="split_probe":
              chunks=[{"start":0,"count":min(64,total),"label":"000000"}]
          elif os.environ["MODE"]=="split_rest":
              chunks=[{"start":i,"count":min(100,total-i),"label":f"{i:06d}"} for i in range(64,total,100)]
          elif os.environ["MODE"]=="all":
              chunks=[{"start":i,"count":min(500,total-i),"label":f"{i:06d}"} for i in range(0,total,500)]
          else:
              start=int(os.environ["QUEUE_START"])
              count=int(os.environ["RETRY_COUNT"])
              if start<0 or count<1 or start+count>total:
                  raise ValueError("Invalid selected unresolved-function queue interval")
              chunks=[{"start":start,"count":count,"label":f"{start:06d}"}]
          if not chunks or len(chunks)>16:
              raise ValueError("Expected 1-16 bounded original-function recovery shards")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("matrix="+json.dumps({"include":chunks},separators=(",",":"))+"\n")
              out.write("mode="+os.environ["MODE"]+"\n")
          print("SOURCE_AUTHENTICATED_GHIDRA_RECOVERY_PLAN",json.dumps({
              "unresolved_original_functions":total,
              "parallel_workers":len(chunks),
              "retry_count":sum(x["count"] for x in chunks),
              "mode":os.environ["MODE"]}))
          PY

  recover-original-functions:
    needs: plan-source-verified-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan-source-verified-recovery.outputs.matrix) }}
    env:
      SOURCE_URL: https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
      SOURCE_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      DUMP_BRANCH: re/fortnite541-ghidra-full
      QUEUE_PATH: ${{ needs.plan-source-verified-recovery.outputs.queue_path }}
      QUEUE_START: ${{ matrix.start }}
      RETRY_COUNT: ${{ matrix.count }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '30' }}
      FULL_ANALYSIS: ${{ inputs.full_analysis && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Stage precise original retail unresolved-function targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/original" "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/ghidra-project" "$RUNNER_TEMP/recovery"
          git fetch origin "$DUMP_BRANCH"
          git show "origin/$DUMP_BRANCH:$QUEUE_PATH" > "$RUNNER_TEMP/input/unresolved.jsonl.gz"
          python3 crates/fortnite_541/tools/prepare_ghidra_recovery.py \
            --unresolved "$RUNNER_TEMP/input/unresolved.jsonl.gz" \
            --start "$QUEUE_START" --count "$RETRY_COUNT" \
            --out "$RUNNER_TEMP/input/targets.tsv"
      - name: Authenticate original Fortnite and official Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 "$SOURCE_URL" -o "$RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 25 --max-time 350 "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          ghidra="$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$ghidra"
          chmod +x "$ghidra"
          echo "GHIDRA_BIN=$ghidra" >> "$GITHUB_ENV"
      - name: Recover selected original Ghidra function entries
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$FULL_ANALYSIS" != "true" ]]; then
            options+=("-noanalysis")
          else
            options+=("-analysisTimeoutPerFile" "600")
          fi
          "$GHIDRA_BIN" "$RUNNER_TEMP/ghidra-project" Fortnite541Recovery \
            -import "$RUNNER_TEMP/original/FortniteClient-Win64-Shipping.exe" \
            "${options[@]}" \
            -scriptPath "$GITHUB_WORKSPACE/crates/fortnite_541/ghidra" \
            -postScript Fortnite541Recover.java "$RUNNER_TEMP/recovery" "$RUNNER_TEMP/input/targets.tsv" "$TIMEOUT_SECONDS" bounded \
            -max-cpu 3 2>&1 | tee "$RUNNER_TEMP/ghidra.log"
          grep -q FORTNITE541_GHIDRA_RECOVERY_COMPLETE "$RUNNER_TEMP/ghidra.log"
      - name: Verify original ordinal identity, pseudocode and Ghidra report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,gzip,json,os,pathlib
          t=pathlib.Path(os.environ["RUNNER_TEMP"])
          expected=[(int(a),a1,a2) for a,a1,a2 in
                    (line.rstrip().split("\t") for line in (t/"input/targets.tsv").read_text().splitlines())]
          files=glob.glob(str(t/"recovery/records/*.jsonl.gz"))
          assert len(files)==1,files
          with gzip.open(files[0],"rt") as f:
              actual=[json.loads(s) for s in f if s.strip()]
          assert len(actual)==len(expected),(len(actual),len(expected))
          assert all((row["index"],row["rva"],row["end_rva"])==entry
                     for row,entry in zip(actual,expected))
          assert all(row["status"] in ("decompiled","decompiler_failed","missing_function") for row in actual)
          assert all(isinstance(row["c"],str) and row["c"].strip()
                     for row in actual if row["status"]=="decompiled")
          summary=json.loads((t/"recovery/recovery_summary.json").read_text())
          assert summary["retry_count"]==len(actual)
          assert summary["recovered"]==sum(r["status"]=="decompiled" for r in actual)
          assert summary["missing"]==sum(r["status"]=="missing_function" for r in actual)
          assert summary["decompiler_failed"]==sum(r["status"]=="decompiler_failed" for r in actual)
          print("ORIGINAL_RETAIL_FUNCTION_RECOVERY_VERIFIED",summary)
          PY
          summary_name="$(basename "$(find "$RUNNER_TEMP/recovery/records" -name '*.jsonl.gz' -print -quit)" .jsonl.gz).json"
          mkdir -p "$RUNNER_TEMP/recovery/reports"
          mv "$RUNNER_TEMP/recovery/recovery_summary.json" "$RUNNER_TEMP/recovery/reports/$summary_name"
      - name: Publish original-function recovery shard to aggregator
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-original-recovery-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/recovery/records/
            ${{ runner.temp }}/recovery/reports/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Preserve source-recovery Ghidra diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-recovery-diagnostics-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/ghidra.log
            ${{ runner.temp }}/input/targets.tsv
          retention-days: 14
          if-no-files-found: warn

  merge-and-audit-original-recoveries:
    if: github.ref == 'refs/heads/main'
    needs: [plan-source-verified-recovery, recover-original-functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fortnite-original-recovery-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Merge all new source-verified Ghidra recoveries and regenerate audited progress
        shell: bash
        env:
          DUMP_BRANCH: re/fortnite541-ghidra-full
          FULL_ANALYSIS: ${{ github.event_name == 'push' && 'true' || inputs.full_analysis && 'true' || 'false' }}
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/audit_ghidra_recovery.py "$RUNNER_TEMP/audit_ghidra_recovery.py"
          python3 "$RUNNER_TEMP/audit_ghidra_recovery.py" --self-test
          git config user.name "Fortnite 5.41 Ghidra recovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DUMP_BRANCH"
          git checkout -B "$DUMP_BRANCH" "origin/$DUMP_BRANCH"
          kind=bounded_v1
          mkdir -p "decompilation/fortnite541/recovery/$kind"
          if [[ ! -f "decompilation/fortnite541/recovery/$kind/source_unresolved.jsonl.gz" ]]; then
            cp decompilation/fortnite541/recovery_remaining.jsonl.gz "decompilation/fortnite541/recovery/$kind/source_unresolved.jsonl.gz"
          fi
          cp -r "$RUNNER_TEMP/shards/." "decompilation/fortnite541/recovery/$kind/"
          python3 "$RUNNER_TEMP/audit_ghidra_recovery.py" --root decompilation/fortnite541
          git add decompilation/fortnite541/recovery decompilation/fortnite541/recovery_status.json decompilation/fortnite541/recovery_remaining.jsonl.gz
          test -n "$(git diff --cached --name-only)"
          git commit -m "Ghidra: original 5.41 unresolved-function recovery with validated C pseudocode"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$DUMP_BRANCH"; then break; fi
            git fetch origin "$DUMP_BRANCH"
            git rebase "origin/$DUMP_BRANCH"
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            sleep "$attempt"
          done
