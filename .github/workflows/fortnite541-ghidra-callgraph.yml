name: Fortnite 5.41 original Ghidra C callgraph index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-ghidra-callgraph.yml"
      - "crates/fortnite_541/tools/index_ghidra_calls.py"
  pull_request:
    paths:
      - ".github/workflows/fortnite541-ghidra-callgraph.yml"
      - "crates/fortnite_541/tools/index_ghidra_calls.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite541-ghidra-callgraph-index
  cancel-in-progress: false

jobs:
  test-index-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real-call-reference parser
        run: |
          python3 -m py_compile crates/fortnite_541/tools/index_ghidra_calls.py
          python3 crates/fortnite_541/tools/index_ghidra_calls.py --self-test

  index-original-ghidra-callgraph:
    needs: test-index-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve authored tooling outside data branch
        run: |
          cp crates/fortnite_541/tools/index_ghidra_calls.py "$RUNNER_TEMP/"
          cp crates/fortnite_541/tools/index_ghidra_pseudocode.py "$RUNNER_TEMP/"
      - name: Extract original Ghidra C references
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin re/fortnite541-ghidra-full
          git checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/index_ghidra_calls.py" \
            --root decompilation/fortnite541 \
            --out "$RUNNER_TEMP/original-callgraph" | tee "$RUNNER_TEMP/callgraph.log"
          python3 - <<'PY'
          import gzip,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'original-callgraph'
          report=json.loads((root/'callgraph_summary.json').read_text())
          assert report['original_pdata_functions']==291757
          assert report['real_ghidra_c_functions']==291701
          assert report['remaining_without_c']==56
          count=0
          with gzip.open(root/'original_ghidra_c_function_calls.jsonl.gz','rt') as rows:
              for row in rows:
                  item=json.loads(row)
                  assert item['original_ordinal']==count
                  assert item['evidence_level'].startswith('ghidra_c_')
                  count+=1
          assert count==291757
          assert json.loads((root/'callgraph_hotspots.json').read_text())
          print('ORIGINAL_GHIDRA_CALLGRAPH_SOURCE_VALIDATED',report)
          PY
      - name: Save source call graph to existing decompilation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite original Ghidra function graph"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          mkdir -p decompilation/fortnite541/index/callgraph
          cp "$RUNNER_TEMP"/original-callgraph/* decompilation/fortnite541/index/callgraph/
          git add decompilation/fortnite541/index/callgraph
          if ! git diff --cached --quiet; then
            git commit -m "Fortnite: 291757 original Ghidra C call-reference records"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then exit 0; fi
              git fetch origin re/fortnite541-ghidra-full
              git rebase origin/re/fortnite541-ghidra-full
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          fi
      - name: Retain readable source-graph stats only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-callgraph-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/original-callgraph/callgraph_summary.json
            ${{ runner.temp }}/original-callgraph/callgraph_hotspots.json
            ${{ runner.temp }}/callgraph.log
          retention-days: 90
          if-no-files-found: warn
