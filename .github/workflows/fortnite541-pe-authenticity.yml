name: Fortnite 5.41 original executable authenticity audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-pe-authenticity.yml"
      - "crates/fortnite_541/tools/audit_original_executable.py"
      - "crates/fortnite_541/tools/probe_original_loader.py"
      - "crates/fortnite_541/tools/trace_preentry.py"
      - "crates/fortnite_541/tools/audit_guard_cfg.py"
      - "crates/fortnite_541/tools/analyze_guard_semantics.py"
      - "crates/fortnite_541/tools/microemu_original_varuint.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-authenticated-retail-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
      SOURCE_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      AUDIT_BRANCH: re/fortnite541-pe-audit-report
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PE and x64 decoding libraries
        run: |
          set -euo pipefail
          python -m pip install pefile==2024.8.26 capstone==5.0.6 unicorn==2.1.3
          python crates/fortnite_541/tools/audit_original_executable.py --self-test
      - name: Download byte-perfect original EXE and verify SHA-256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retail" "$RUNNER_TEMP/audit"
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 300 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe")" = 97284496
      - name: Verify native guard callee and 7-bit decoder semantic evidence
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/analyze_guard_semantics.py --self-test
          python crates/fortnite_541/tools/analyze_guard_semantics.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_guard_semantics.json"
          test -s "$RUNNER_TEMP/audit/fortnite541_guard_semantics.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"audit"/"fortnite541_guard_semantics.json"
          r=json.loads(p.read_text())
          assert r["sha256_verified"]==os.environ["SOURCE_SHA256"]
          assert r["roots"]["guard_call_target"]["entry_rva"]=="0x5b0cf49"
          assert r["roots"]["guard_call_target"]["instruction_count"]>0
          assert r["roots"]["seven_bit_reader"]["instruction_count"]>0
          print("AUTHENTIC_GUARD_SEMANTICS_VERIFIED")
          PY
      - name: Micro-emulate original native x64 unsigned-varint loop
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/microemu_original_varuint.py --self-test
          python crates/fortnite_541/tools/microemu_original_varuint.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_varuint_microemu.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"audit"/"fortnite541_varuint_microemu.json"
          r=json.loads(p.read_text())
          assert r["source_sha256_verified"]==os.environ["SOURCE_SHA256"]
          assert r["all_passed"]
          assert len(r["vectors"])>=8
          assert all(v["match"] for v in r["vectors"])
          print("AUTHENTIC_ORIGINAL_X64_VARUINT_MICROEMU_VERIFIED")
          PY
      - name: Inspect PE sections, entrypoint, imports and machine instructions
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/audit_original_executable.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_pe_audit.json"
          test -s "$RUNNER_TEMP/audit/fortnite541_pe_audit.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"audit"/"fortnite541_pe_audit.json"
          r=json.loads(p.read_text())
          assert r["source_sha256"]==os.environ["SOURCE_SHA256"]
          assert r["file_size"]==97284496
          assert r["headers"]["entry_section"]
          assert r["pdata"]["valid_records"]>0
          assert r["code_sample"]["sampled_ranges"]>0
          print("SOURCE_AUTHENTICATED_RETAIL_PE_AUDIT_VERIFIED")
          print((p.parent/"fortnite541_pe_audit.md").read_text())
          PY
      - name: Probe authenticated entrypoint and executable section regions
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/probe_original_loader.py --self-test
          python crates/fortnite_541/tools/probe_original_loader.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_loader_probe.json"
          test -s "$RUNNER_TEMP/audit/fortnite541_loader_probe.md"
      - name: Source-verify pre-entrypoint TLS and original function-trampoline census
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/trace_preentry.py --self-test
          python crates/fortnite_541/tools/trace_preentry.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_preentry.json"
          test -s "$RUNNER_TEMP/audit/fortnite541_preentry.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"audit"/"fortnite541_preentry.json"
          r=json.loads(p.read_text())
          assert r["source_sha256_verified"]==os.environ["SOURCE_SHA256"]
          assert r["total_unwind_ranges"]==291757
          assert r["function_start_pattern_census"]["starts_examined"]>200000
          assert r["entrypoint_call_target_rva"]=="0x5ae6509"
          print("PREENTRY_ORIGINAL_PROVENANCE_VERIFIED")
          PY
      - name: Source-verified guarded CFG and original code-write evidence
        run: |
          set -euo pipefail
          python crates/fortnite_541/tools/audit_guard_cfg.py --self-test
          python crates/fortnite_541/tools/audit_guard_cfg.py \
            --exe "$RUNNER_TEMP/retail/FortniteClient-Win64-Shipping.exe" \
            --out "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/fortnite541_guard_cfg.json"
          test -s "$RUNNER_TEMP/audit/fortnite541_guard_cfg.md"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"audit"/"fortnite541_guard_cfg.json"
          d=json.loads(p.read_text())
          assert d["source_sha256_verified"]==os.environ["SOURCE_SHA256"]
          assert all(x["decoded_instruction_starts"]>0 for x in d["studies"].values())
          assert d["candidate_roots"]["entry_call_handoff"]=="0x4419"
          print("FORTNITE_GUARDED_CFG_PROVENANCE_VERIFIED")
          PY
      - name: Commit structured report only, never original executable
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "Fortnite original PE audit"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$AUDIT_BRANCH" >/dev/null; then
            git fetch origin "$AUDIT_BRANCH"
            git checkout -B "$AUDIT_BRANCH" FETCH_HEAD
          else
            git fetch origin main
            git checkout -B "$AUDIT_BRANCH" origin/main
          fi
          mkdir -p decompilation/fortnite541/pe_audit
          cp "$RUNNER_TEMP/audit/"*.json "$RUNNER_TEMP/audit/"*.md decompilation/fortnite541/pe_audit/
          git add decompilation/fortnite541/pe_audit
          if ! git diff --cached --quiet; then
            git commit -m "Audit: SHA-verified Fortnite 5.41 EXE PE structure"
            git push origin "HEAD:refs/heads/$AUDIT_BRANCH"
          fi
      - name: Upload analysis artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-authentic-exe-audit
          path: ${{ runner.temp }}/audit/
          retention-days: 30
          if-no-files-found: warn
