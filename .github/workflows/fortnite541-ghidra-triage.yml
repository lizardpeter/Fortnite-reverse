name: Fortnite 5.41 original function failure triage

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "crates/fortnite_541/tools/triage_ghidra_recovery.py"
      - ".github/workflows/fortnite541-ghidra-triage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-authenticated-final-failure-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test source-function triage and rejected forged RVA
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/fortnite_541/tools/triage_ghidra_recovery.py --self-test
      - name: Classify actual remaining original native routines
        shell: bash
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/triage_ghidra_recovery.py "$RUNNER_TEMP/triage_ghidra_recovery.py"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B original-data origin/re/fortnite541-ghidra-full
          python3 "$RUNNER_TEMP/triage_ghidra_recovery.py" --root decompilation/fortnite541
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("decompilation/fortnite541")
          report=json.loads((root/"recovery_failure_triage.json").read_text())
          original=json.loads((root/"recovery_status.json").read_text())
          assert report["still_unresolved"]==original["unresolved_remaining"]
          assert report["successfully_decompiled"]==original["effectively_decompiled"]
          assert sum(report["error_classes"].values())==report["still_unresolved"]
          assert sum(report["latest_statuses"].values())==report["still_unresolved"]
          print("ORIGINAL_SOURCE_FUNCTION_FAILURE_TRIAGE_VERIFIED",report)
          PY
      - name: Commit source-exact failure cases to permanent public dump
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite 5.41 Ghidra failure triage"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decompilation/fortnite541/recovery_failure_triage.json decompilation/fortnite541/recovery_failure_cases.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ghidra: independently verified final .pdata failure root-cause cases"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then break; fi
            git fetch origin re/fortnite541-ghidra-full
            git rebase origin/re/fortnite541-ghidra-full
            if [[ "$attempt" == 5 ]]; then exit 1; fi
            sleep "$attempt"
          done
