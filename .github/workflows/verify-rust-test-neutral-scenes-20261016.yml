name: Verify Rust-test full importer compile

on:
  push:
    branches: [ci/rust-test-neutral-scene-compile-20261016]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-full-compile:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Fetch exact merged Rust-test revision
        uses: actions/checkout@v4
        with:
          repository: lizardpeter/Rust-test
          ref: 38e4feb9bf0048625efbf1dd4fcae49d00250c36
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile full FPS game (all default source importers)
        id: compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --bin fps_game 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\rust-test-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save full compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-neutral-scenes-full-windows-build-log
          path: ${{ runner.temp }}/rust-test-build.log
          if-no-files-found: warn
          retention-days: 7
