name: Fortnite 5.41 Ghidra restored-native full-function dump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-ghidra-restored.yml"
      - "crates/fortnite_541/ghidra/Fortnite541FullDump.java"
  workflow_dispatch:
    inputs:
      start_index:
        description: "First restored original PE .pdata function index"
        required: true
        default: "0"
        type: string
      function_count:
        description: "Number of original functions in this batch (1..10000)"
        required: true
        default: "256"
        type: string
      timeout_seconds:
        description: "Ghidra decompiler seconds per function"
        required: true
        default: "10"
        type: string
      full_analysis:
        description: "Perform full Ghidra PE analysis instead of fast import"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  original-win64-function-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOURCE_ARTIFACT_RUN: "38947743292"
      SOURCE_ARTIFACT_NAME: fortnite541-restored-analysis-pe-38947743292
      SOURCE_SHA256: b2792fd5d7639a7277cd131ca50bdd898ff2b8721c66bc4ae0e8ebcd61652379
      ORIGINAL_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      GH_TOKEN: ${{ github.token }}
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      DUMP_BRANCH: re/fortnite541-ghidra-restored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify parameters and prepare scratch directories
        shell: bash
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start_index || '0' }}
          COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.function_count || '128' }}
          DECOMP_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout_seconds || '8' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          start=int(os.environ["START"])
          count=int(os.environ["COUNT"])
          timeout=int(os.environ["DECOMP_TIMEOUT"])
          assert 0<=start<500000 and 1<=count<=10000 and 1<=timeout<=120
          print("GHIDRA ORIGINAL FORTNITE 5.41 FUNCTION RANGE", start,count,timeout)
          PY
          mkdir -p "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/ghidra-project" "$RUNNER_TEMP/original" "$RUNNER_TEMP/ghidra-dump"
      - name: Download verified restored PE from durable GitHub Actions artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT_NAME" --dir "$RUNNER_TEMP/original"
          exe="$RUNNER_TEMP/original/FortniteClient-Win64-Shipping-5.41-restored-analysis.exe"
          echo "$SOURCE_SHA256  $exe" | sha256sum -c -
          export RESTORED_MANIFEST="$RUNNER_TEMP/original/manifest.json"
          python3 - <<'PY'
          import json,os,pathlib
          m=json.loads(pathlib.Path(os.environ['RESTORED_MANIFEST']).read_text())
          assert m['original_sha256']==os.environ['ORIGINAL_SHA256']
          assert m['restored_sha256']==os.environ['SOURCE_SHA256']
          assert m['restored_size_bytes']==97284496
          print('SOURCE_RESTORED_NATIVE_MACHINE_CODE_VERIFIED',m['restored_sha256'])
          PY
          echo "RESTORED_EXE=$exe" >> "$GITHUB_ENV"
      - name: Verify official Ghidra 12.1.4 and install locally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 350 "$GHIDRA_URL" \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          bin="$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GHIDRA_BIN=$bin" >> "$GITHUB_ENV"
      - name: Decompile original source-addressed native PE function batch
        shell: bash
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start_index || '0' }}
          COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.function_count || '128' }}
          DECOMP_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout_seconds || '8' }}
          DO_ANALYSIS: ${{ github.event_name == 'push' && 'true' || (inputs.full_analysis && 'true' || 'false') }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$DO_ANALYSIS" != "true" ]]; then
            options+=("-noanalysis")
          else
            options+=("-analysisTimeoutPerFile" "6600")
          fi
          "$GHIDRA_BIN" "$RUNNER_TEMP/ghidra-project" Fortnite541Restored \
            -import "$RESTORED_EXE" \
            "${options[@]}" \
            -scriptPath "$GITHUB_WORKSPACE/crates/fortnite_541/ghidra" \
            -postScript Fortnite541FullDump.java "$RUNNER_TEMP/ghidra-dump" "$START" "$COUNT" "$DECOMP_TIMEOUT" \
            -max-cpu 3 2>&1 | tee "$RUNNER_TEMP/ghidra.log"
          test -s "$RUNNER_TEMP/ghidra-dump/last_batch.json"
          grep -q FORTNITE541_GHIDRA_BATCH_COMPLETE "$RUNNER_TEMP/ghidra.log"
          python3 - <<'PY'
          import os,json,glob,gzip
          base=os.path.join(os.environ["RUNNER_TEMP"],"ghidra-dump")
          meta=json.load(open(os.path.join(base,"last_batch.json")))
          candidates=glob.glob(os.path.join(base,"functions","*.jsonl.gz"))
          assert len(candidates)==1,candidates
          with gzip.open(candidates[0],"rt") as reader:
              data=[json.loads(line) for line in reader if line.strip()]
          assert len(data)==meta["batch_end_exclusive"]-meta["batch_start"]
          assert len(data)==meta["decompiled"]+meta["decompiler_failed"]+meta["missing"]
          print("FORTNITE ORIGINAL COMPLETE DUMP SHARD VERIFIED",meta)
          PY
      - name: Publish Ghidra RESTORED-code pseudocode shard and complete .pdata index to separate Git
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fortnite 5.41 reverse engineering"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DUMP_BRANCH" >/dev/null; then
            git fetch origin "$DUMP_BRANCH"
            git checkout -B "$DUMP_BRANCH" FETCH_HEAD
          else
            git checkout -B "$DUMP_BRANCH"
          fi
          mkdir -p decompilation/fortnite541_restored
          cp -r "$RUNNER_TEMP/ghidra-dump/." decompilation/fortnite541_restored/
          git add decompilation/fortnite541_restored
          if ! git diff --cached --quiet; then
            git commit -m "Ghidra: Fortnite 5.41 complete original function batch $GITHUB_RUN_ID"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:refs/heads/$DUMP_BRANCH"; then break; fi
              git fetch origin "$DUMP_BRANCH"
              git rebase "origin/$DUMP_BRANCH"
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep "$attempt"
            done
          fi
      - name: Preserve Ghidra logs and batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-restored-ghidra-batch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ghidra.log
            ${{ runner.temp }}/ghidra-dump/last_batch.json
          retention-days: 90
          if-no-files-found: warn
