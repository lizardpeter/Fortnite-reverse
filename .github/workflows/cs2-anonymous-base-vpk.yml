name: CS2 base VPK anonymous download
on:
  push:
    branches:
      - probe/cs2-anonymous-base-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cs2-base-anonymous:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Download official SteamRE DepotDownloader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/depot-tool"
          curl -fL --retry 4 --connect-timeout 20 \
            https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip \
            -o "$RUNNER_TEMP/depot-tool.zip"
          unzip -q "$RUNNER_TEMP/depot-tool.zip" -d "$RUNNER_TEMP/depot-tool"
          echo "DepotDownloader package:"
          ls -la "$RUNNER_TEMP/depot-tool" | head -n 25
      - name: Attempt anonymous Steam CS2 base depot download
        shell: bash
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/cs2-filelist.txt" <<'ENDLIST'
          game/csgo/pak01_dir.vpk
          game/csgo/pak01_262.vpk
          game/csgo/pak01_386.vpk
          ENDLIST
          mkdir -p "$RUNNER_TEMP/cs2-test"
          cd "$RUNNER_TEMP/depot-tool"
          exe=$(find . -type f \( -name DepotDownloader -o -name DepotDownloader.dll \) -print -quit)
          if [[ -z "$exe" ]]; then echo "ERROR: No DepotDownloader program in release ZIP"; exit 2; fi
          if [[ "$exe" == *.dll ]]; then cmd=(dotnet "$exe"); else chmod +x "$exe"; cmd=("$exe"); fi
          echo "Trying Steam anonymous: app 730, depot 2347770, 3 relevant Dust2 base VPK files."
          echo "No Steam username/password is supplied."
          timeout 780 "${cmd[@]}" \
            -app 730 -depot 2347770 \
            -filelist "$RUNNER_TEMP/cs2-filelist.txt" \
            -dir "$RUNNER_TEMP/cs2-test" \
            -max-downloads 4 \
            2>&1 | tee "$RUNNER_TEMP/cs2-anonymous-download.log"
          status=${PIPESTATUS[0]}
          echo "DEPOT_DOWNLOADER_EXIT_STATUS=$status"
          echo "Source files:"
          find "$RUNNER_TEMP/cs2-test" -type f -printf '%P (%s bytes)\n' | head -n 60
          dir="$RUNNER_TEMP/cs2-test/game/csgo/pak01_dir.vpk"
          part="$RUNNER_TEMP/cs2-test/game/csgo/pak01_262.vpk"
          sky="$RUNNER_TEMP/cs2-test/game/csgo/pak01_386.vpk"
          if [[ -s "$dir" && -s "$part" && -s "$sky" ]]; then
            echo "SUCCESS: original Counter-Strike 2 archive index AND numbered VPK downloaded anonymously."
            sha256sum "$dir" "$part" "$sky"
            du -sh "$RUNNER_TEMP/cs2-test"
            echo "### Success: CS2 base VPK files downloaded anonymously" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ERROR: CS2 archive bytes missing, or Steam depot access denied."
            echo "### Failure: CS2 base VPK file(s) not downloaded" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Inspect exact original CS2 base VPK entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections,struct
          path=Path(__import__('os').environ['RUNNER_TEMP'])/'cs2-test/game/csgo/pak01_dir.vpk'
          data=path.read_bytes()
          sig,ver,tree_size=struct.unpack_from('<III',data)
          assert sig==0x55aa1234,(sig,ver)
          start={1:12,2:28}[ver];end=start+tree_size;at=start
          exts=collections.Counter()
          matched=[]
          count=0
          def readstring():
              global at
              nxt=data.index(b'\x00',at,end)
              s=data[at:nxt].decode('utf-8','replace');at=nxt+1
              return s
          while at<end:
              ext=readstring()
              if not ext:break
              while True:
                  folder=readstring()
                  if not folder:break
                  while True:
                      stem=readstring()
                      if not stem:break
                      crc,preload,archive,offset,length,sentinel=struct.unpack_from('<IHHIIH',data,at)
                      assert sentinel==0xffff
                      at+=18+preload
                      path_name=(folder+'/' if folder!=' ' else '')+stem+'.'+ext
                      count+=1;exts[ext]+=1
                      if path_name in [
                        'materials/de_dust/hr_dust/hr_dust_blend_asphalt_07.vmat_c',
                        'materials/de_dust/hr_dust/hr_dust_blend_floortile_01.vmat_c',
                        'materials/skybox/sky_de_dust2vmat.vmat_c',
                      ] or path_name.startswith('materials/de_dust/hr_dust/') and len(matched)<16:
                          matched.append((path_name,archive,offset,length))
          print('CS2_BASE_VPK_VER',ver,'INDEX_SIZE',len(data),'TREE_ENTRIES',count)
          print('TOP_TYPES',exts.most_common(16))
          print('RELEVANT_MATERIAL_ENTRIES',matched)
          # Validate exact archive payloads, not just filename metadata.
          samples={
            'materials/de_dust/hr_dust/hr_dust_blend_asphalt_07.vmat_c',
            'materials/skybox/sky_de_dust2vmat.vmat_c',
          }
          folder=path.parent
          for filename,archive,offset,size in matched:
              if filename not in samples: continue
              source=folder/f'pak01_{archive:03d}.vpk'
              assert source.exists(),(filename,source)
              with source.open('rb') as stream:
                  stream.seek(offset)
                  first=stream.read(min(32,size))
              assert len(first)==min(32,size)
              declared=int.from_bytes(first[:4],'little')
              version=int.from_bytes(first[4:6],'little')
              print('EXACT_SOURCE_RESOURCE',filename,'archive',archive,'bytes',size,'resource_version',version,'declared',declared,'header',first.hex(' '))
          PY
      - name: Publish CS2 base archive index and sample data
        uses: actions/upload-artifact@v4
        with:
          name: cs2-anonymous-dust2-materials-and-sky-vpks
          path: |
            ${{ runner.temp }}/cs2-test/game/csgo/pak01_dir.vpk
            ${{ runner.temp }}/cs2-test/game/csgo/pak01_262.vpk
            ${{ runner.temp }}/cs2-test/game/csgo/pak01_386.vpk
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
