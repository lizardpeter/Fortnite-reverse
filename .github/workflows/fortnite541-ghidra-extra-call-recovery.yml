name: Fortnite 5.41 recover authentic non-pdata direct CALL functions

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - ".github/workflows/fortnite541-ghidra-extra-call-recovery.yml"
      - "crates/fortnite_541/ghidra/Fortnite541RecoverDirectCalls.java"
      - "crates/fortnite_541/tools/prepare_nonpdata_calls.py"
      - "crates/fortnite_541/tools/audit_nonpdata_recovery.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite541-authenticated-extra-call-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-original-verified-call-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test original source evidence and plan real decompilation shards
        id: targets
        shell: bash
        env:
          ALL: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 crates/fortnite_541/tools/prepare_nonpdata_calls.py --self-test
          python3 crates/fortnite_541/tools/audit_nonpdata_recovery.py --self-test
          git fetch origin re/fortnite541-ghidra-full
          git show origin/re/fortnite541-ghidra-full:decompilation/fortnite541/discovery/nonpdata_direct_calls.jsonl.gz > "$RUNNER_TEMP/source_calls.jsonl.gz"
          python3 - <<'PY'
          import gzip,json,os
          with gzip.open(os.environ["RUNNER_TEMP"]+"/source_calls.jsonl.gz","rt") as f:
              rows=[json.loads(line) for line in f if line.strip()]
          assert len(rows)==58
          if os.environ["ALL"]=="true":
              chunks=[{"start":i,"count":min(8,58-i),"label":f"{i:03d}"} for i in range(0,58,8)]
          else:
              chunks=[{"start":0,"count":8,"label":"000"}]
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("matrix="+json.dumps({"include":chunks},separators=(",",":"))+"\n")
          print("FORTNITE541_SOURCE_DIRECT_CALL_RECOVERY_PLAN",json.dumps(chunks))
          PY

  ghidra-original-direct-calls:
    needs: plan-original-verified-call-targets
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan-original-verified-call-targets.outputs.matrix) }}
    env:
      SOURCE_URL: https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
      SOURCE_SHA256: 7a1805869283ffa74df400d9e32dda4a1b6c07ebb0e0a1ce027ee846a18bd108
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
      DUMP_BRANCH: re/fortnite541-ghidra-full
      SHARD_START: ${{ matrix.start }}
      SHARD_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare exact verified original retail CALL targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/ghidra" "$RUNNER_TEMP/project" "$RUNNER_TEMP/recovered"
          git fetch origin "$DUMP_BRANCH"
          git show "origin/$DUMP_BRANCH:decompilation/fortnite541/discovery/nonpdata_direct_calls.jsonl.gz" > "$RUNNER_TEMP/source/calls.jsonl.gz"
          python3 crates/fortnite_541/tools/prepare_nonpdata_calls.py \
            --source "$RUNNER_TEMP/source/calls.jsonl.gz" \
            --start "$SHARD_START" --count "$SHARD_COUNT" \
            --output "$RUNNER_TEMP/source/targets.tsv"
      - name: Authenticate original 5.41 retail executable and Ghidra binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 300 "$SOURCE_URL" -o "$RUNNER_TEMP/source/FortniteClient-Win64-Shipping.exe"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/source/FortniteClient-Win64-Shipping.exe" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 25 --max-time 350 "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          executable="$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$executable"
          chmod +x "$executable"
          echo "GHIDRA_EXEC=$executable" >> "$GITHUB_ENV"
      - name: Actually decompile only original executable source-witnessed nonpdata CALL targets
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_EXEC" "$RUNNER_TEMP/project" Fortnite541ExtraCalls \
            -import "$RUNNER_TEMP/source/FortniteClient-Win64-Shipping.exe" \
            -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/crates/fortnite_541/ghidra" \
            -postScript Fortnite541RecoverDirectCalls.java "$RUNNER_TEMP/recovered" "$RUNNER_TEMP/source/targets.tsv" 30 \
            -max-cpu 3 2>&1 | tee "$RUNNER_TEMP/ghidra.log"
          grep -q FORTNITE541_NONPDATA_RECOVERY_COMPLETE "$RUNNER_TEMP/ghidra.log"
      - name: Verify exact attempted original source CALL witness and decompiler outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,gzip,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          expected=[(int(i),rva,callsite,int(calls)) for i,rva,callsite,calls in
                    (line.split("\t") for line in (root/"source/targets.tsv").read_text().splitlines())]
          shards=glob.glob(str(root/"recovered/records/direct_calls_*.jsonl.gz"))
          assert len(shards)==1,shards
          with gzip.open(shards[0],"rt") as f:
              rows=[json.loads(s) for s in f if s.strip()]
          assert len(rows)==len(expected)
          assert all((r["index"],r["rva"],r["callsite_rva"],r["original_direct_calls"])==e
                     for r,e in zip(rows,expected))
          assert all((r["status"]!="decompiled") or
                     (r["witness_valid"] and isinstance(r["c"],str) and r["c"].strip())
                     for r in rows)
          report=json.loads((root/"recovered/source_directcall_recovery_summary.json").read_text())
          assert report["attempted"]==len(rows)
          assert report["decompiled"]==sum(r["status"]=="decompiled" for r in rows)
          print("FORTNITE541_GENUINE_NONPDATA_ORIGINAL_FUNCTIONS_VERIFIED",report)
          PY
          report_name="$(basename "$(find "$RUNNER_TEMP/recovered/records" -name '*.jsonl.gz' -print -quit)" .jsonl.gz).json"
          mkdir -p "$RUNNER_TEMP/recovered/reports"
          mv "$RUNNER_TEMP/recovered/source_directcall_recovery_summary.json" \
            "$RUNNER_TEMP/recovered/reports/$report_name"
      - name: Upload only verified Ghidra C records for merge
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-authentic-call-C-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/recovered/records/
            ${{ runner.temp }}/recovered/reports/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Save actual original Ghidra diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-call-diagnostics-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/ghidra.log
            ${{ runner.temp }}/source/targets.tsv
          retention-days: 14
          if-no-files-found: warn

  audit-and-permanently-save-source-call-C:
    if: github.ref == 'refs/heads/main'
    needs: [plan-original-verified-call-targets, ghidra-original-direct-calls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fortnite541-authentic-call-C-*
          merge-multiple: true
          path: ${{ runner.temp }}/recovered
      - name: Validate and commit real source-backed leaf-function C
        shell: bash
        run: |
          set -euo pipefail
          cp crates/fortnite_541/tools/audit_nonpdata_recovery.py "$RUNNER_TEMP/audit_nonpdata_recovery.py"
          python3 "$RUNNER_TEMP/audit_nonpdata_recovery.py" --self-test
          git config user.name "Fortnite 5.41 nonpdata Ghidra native functions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin re/fortnite541-ghidra-full
          git checkout -B re/fortnite541-ghidra-full origin/re/fortnite541-ghidra-full
          target=decompilation/fortnite541/discovery/nonpdata_recovery
          mkdir -p "$target"
          cp -r "$RUNNER_TEMP/recovered/." "$target/"
          python3 "$RUNNER_TEMP/audit_nonpdata_recovery.py" --root decompilation/fortnite541
          git add "$target"
          test -n "$(git diff --cached --name-only)"
          git commit -m "Ghidra: genuine C pseudocode for authenticated direct CALL targets outside .pdata"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/re/fortnite541-ghidra-full; then break; fi
            git fetch origin re/fortnite541-ghidra-full
            git rebase origin/re/fortnite541-ghidra-full
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            sleep "$attempt"
          done
