[package]
name = "cs2-importer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crc32fast = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }
meshopt = "0.6.2"
bcdec_rs = "0.2"
half = "2"
naga = { version = "30.0.0", default-features = false, features = ["spv-in", "spv-out", "wgsl-in", "wgsl-out"] }
spirv-webgpu-transform = "=0.1.7"
neutral-scene = { path = "../neutral-scene-contract" }

[[bin]]
name = "cs2_source_audit"
path = "src/bin/audit.rs"

[[bin]]
name = "cs2_source_extract"
path = "src/bin/extract.rs"

[[bin]]
name = "cs2_preview_validation"
path = "src/bin/preview_validation.rs"

[[bin]]
name = "texture_audit"
path = "src/bin/texture_audit.rs"

[[bin]]
name = "cs2_inventory"
path = "src/bin/inventory.rs"

[[bin]]
name = "sky_light_audit"
path = "src/bin/sky_light_audit.rs"

[[bin]]
name = "visual_defects_audit"
path = "src/bin/visual_defects_audit.rs"

[[bin]]
name = "lightmap_layout_audit"
path = "src/bin/lightmap_layout_audit.rs"
